<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=430"/>
<link rel="stylesheet" href="styles.css"/>
<title>Nearby inbox — JunctionShare</title>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span class="status-icons">●●● ▮▮▮ 🔋</span>
  </div>
  <div class="content">
    <div class="back">← Back</div>
    <div class="title-sm">Nearby inbox</div>
    <div class="nearby-card">
      <div class="nearby-name">Alex · ~80m</div>
      <div class="nearby-body">Needs ride to West Windsor Community Park · 1 seat(s)</div>
      <div class="actions">
        <div class="yes">Interested</div>
        <div class="no">Decline</div>
      </div>
    </div>
    <div class="nearby-card">
      <div class="nearby-name">Jordan · ~220m</div>
      <div class="nearby-body">Has seats to MarketFair Mall · 2 seat(s)</div>
      <div class="actions">
        <div class="yes">Interested</div>
        <div class="no">Decline</div>
      </div>
    </div>
    <div class="nearby-card">
      <div class="nearby-name">Sam · ~450m</div>
      <div class="nearby-body">Needs ride to Edinburg Rd / Quakerbridge · 1 seat(s)</div>
      <div class="actions">
        <div class="yes">Interested</div>
        <div class="no">Decline</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
